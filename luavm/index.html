<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050505;
    --fg: #fafafa;
    --muted: #a3a3a3;
    --muted-2: #737373;
    --border: rgba(255,255,255,0.08);
    --card: rgba(255,255,255,0.04);
    --accent: rgba(255,255,255,0.10);
    --primary: #e8d4b4;
    --code-bg: rgba(255,255,255,0.04);
    --callout-bg: rgba(232,212,180,0.05);
    --gold: #c7b18f;
    --gold-dim: rgba(199,177,143,0.15);
  }
  html, body { background: transparent; color: var(--fg); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  body { position: relative; min-height: 100vh; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  .bg-mesh {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 1) 0%, rgba(5, 5, 5, 1) 100%);
    z-index: -2;
    pointer-events: none;
  }
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    opacity: 0.4;
    pointer-events: none;
  }

  .glass-nav {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    transition: all 0.3s ease;
  }
  .glass-nav.scrolled {
    background: rgba(5, 5, 5, 0.8);
    border-color: rgba(255, 255, 255, 0.1);
  }
  .nav-tab {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s;
    position: relative;
  }
  .nav-tab::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: var(--gold);
    transition: all 0.3s ease;
    transform: translateX(-50%);
  }
  .nav-tab.active, .nav-tab:hover { color: white; }
  .nav-tab.active::after, .nav-tab:hover::after { width: 60%; }
  .mobile-menu-btn { display: none; background: none; border: none; color: white; cursor: pointer; padding: 8px; }
  .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: rgba(5,5,5,0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem; z-index: 999; flex-direction: column; gap: 0.5rem; }
  .mobile-menu.show { display: flex; }
  .mobile-menu .nav-tab { text-align: center; padding: 1rem; border-radius: 8px; }
  .mobile-menu .nav-tab.active { background: var(--gold-dim); color: var(--gold); }
  .logo-box { transition: transform 0.3s ease; }
  .logo-box:hover { transform: rotate(10deg) scale(1.05); }
  .btn-discord { background: #5865F2; color: white; display: flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease; }
  .btn-discord:hover { background: #4752c4; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(88,101,242,0.3); }

  .layout { max-width: 80rem; margin: 0 auto; padding: 2.5rem 1.5rem; display: flex; gap: 2rem; }
  aside { width: 16rem; flex-shrink: 0; position: sticky; top: 5rem; height: calc(100vh - 6rem); overflow-y: auto; }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }
  nav.sidebar { display: flex; flex-direction: column; gap: 1.5rem; font-size: 0.875rem; padding-right: 0.5rem; }
  .nav-group-heading { padding: 0 0.75rem 0.5rem; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted-2); display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; transition: color .15s; }
  .nav-group-heading:hover { color: var(--muted); }
  .nav-group-heading .chevron { font-size: 1rem; transition: transform .2s; color: var(--muted-2); line-height: 1; display: inline-flex; }
  .nav-group-heading .chevron.open { transform: rotate(90deg); }
  .nav-group-items { overflow: hidden; transition: max-height .25s ease; max-height: 0; }
  .nav-group-items.open { max-height: 500px; }
  .nav-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .nav-link {
    position: relative; display: flex; align-items: center; gap: 0.5rem;
    padding: 0.45rem 0.75rem; border-radius: 0.375rem;
    color: var(--muted); transition: all .15s; font-size: 0.8125rem;
  }
  .nav-link svg { flex-shrink: 0; opacity: 0.5; }
  .nav-link.active svg { opacity: 1; }
  .nav-link:hover { background: rgba(255,255,255,0.04); color: #ccc; }
  .nav-link.active { background: var(--gold-dim); color: var(--gold); font-weight: 600; }
  .nav-link.active::before {
    content: ""; position: absolute; left: 0; top: 50%;
    height: 1.25rem; width: 3px; transform: translateY(-50%);
    border-radius: 9999px; background: var(--gold);
  }

  main { min-width: 0; flex: 1; }
  article { max-width: 54rem; }
  article h1 {
    font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
    background: linear-gradient(135deg, #fff 40%, var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  article .intro { margin-top: 0.75rem; font-size: 1.125rem; color: var(--muted); line-height: 1.7; }
  article .body { margin-top: 2rem; }
  article h2 {
    font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em;
    margin: 2.5rem 0 1rem; color: var(--fg);
    display: flex; align-items: center; gap: 0.75rem;
  }
  article h2::before {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }
  article h2:first-child::before { display: none; }
  article h3 { font-size: 1.2rem; font-weight: 600; margin: 2rem 0 0.75rem; color: var(--gold); }
  article h4 { font-size: 0.95rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  article p { line-height: 1.8; color: #d4d4d4; margin-bottom: 1rem; font-size: 0.9375rem; }
  article ul, article ol { margin: 0 0 1.25rem 1.5rem; color: var(--muted); line-height: 1.7; }
  article ul li, article ol li { margin-bottom: 0.35rem; }
  article ul li::marker { color: var(--gold); }
  article code {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    background: rgba(255,255,255,0.06); padding: 0.15rem 0.4rem;
    border-radius: 0.3rem; font-size: 0.85em; color: var(--gold);
  }
  article pre code { background: none; padding: 0; border-radius: 0; color: inherit; }
  .callout {
    border-left: 3px solid var(--gold); background: var(--gold-dim);
    padding: 1.25rem 1.5rem; border-radius: 0.75rem; margin-bottom: 1.25rem;
  }
  .callout p { margin-bottom: 0.75rem; color: #e5e5e5; font-size: 0.9rem; }
  .callout p:last-child { margin-bottom: 0; }
  .requires-badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(255,215,0,0.08); border: 1px solid rgba(255,215,0,0.15);
    border-radius: 2rem; padding: 0.35rem 1rem; margin-bottom: 1.5rem;
    font-size: 0.8rem; color: var(--muted-2); width: fit-content;
  }
  .requires-badge code { color: var(--gold); font-size: 0.8rem; }
  .codeblock {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 0.75rem; padding: 1.25rem; font-size: 0.85rem;
    overflow-x: auto; white-space: pre; color: #e5e5e5; margin-bottom: 1.25rem;
    line-height: 1.6;
  }
  .codeblock::-webkit-scrollbar { height: 4px; }
  .codeblock::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  .table-wrap {
    overflow-x: auto;
    border-radius: 0.75rem;
    margin-bottom: 1.25rem;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.875rem; }
  thead {}
  thead th {
    background: rgba(255,255,255,0.03);
    color: var(--muted-2);
    text-align: left;
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  thead th:first-child { border-radius: 0.75rem 0 0 0; }
  thead th:last-child { border-radius: 0 0.75rem 0 0; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  tbody tr + tr { border-top: 1px solid var(--border); }
  th, td { padding: 0.65rem 1rem; vertical-align: top; }
  td { color: #d4d4d4; }
  td:first-child { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 0.85em; white-space: nowrap; color: #e5e5e5; }
  td:nth-child(2) { color: var(--muted); }

  .pager { margin-top: 3rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .pager a {
    display: flex; flex-direction: column; gap: 0.25rem;
    padding: 1rem 1.25rem; border: 1px solid var(--border);
    background: var(--card); border-radius: 0.75rem;
    transition: all .2s;
  }
  .pager a:hover { border-color: var(--gold-dim); background: rgba(255,255,255,0.03); }
  .pager a.right { align-items: flex-end; text-align: right; }
  .pager .label-tiny { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-2); }
  .pager .label-main { font-weight: 600; color: var(--fg); }

  @media (max-width: 768px) {
    aside { display: none; }
    .layout { padding: 1.5rem 1rem; flex-direction: column; }
    article h1 { font-size: 1.75rem; }
    .nav-tabs-desktop { display: none !important; }
    .mobile-menu-btn { display: block; }
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
</style>
</head>

function toTable(headers, rows) {
  const h = headers.map(h => `<th>${h}</th>`).join("");
  const r = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div class="table-wrap"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;
}

function toCodeblock(code) {
  return `<div class="codeblock language-lua">${code}</div>`;
}

function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h && PAGES[h] ? h : "/";
}

// Flatten NAV items (in order) for prev/next
function flatNav() {
  const result = [];
  NAV.forEach(g => {
    if (g.items) g.items.forEach(i => { if (i.to) result.push(i); });
  });
  return result;
}

function renderSidebar() {
  const path = currentPath();
  // Preserve manually toggled open state across re-renders
  const openHeadings = new Set();
  document.querySelectorAll(".nav-group-heading").forEach(el => {
    const next = el.nextElementSibling;
    if (next && next.classList.contains("nav-group-items") && next.classList.contains("open") && el.dataset.heading) {
      openHeadings.add(el.dataset.heading);
    }
  });
  document.getElementById("sidebar").innerHTML = NAV.map(group => {
    const heading = group.heading ? `<div class="nav-group-heading" data-heading="${group.heading}" onclick="toggleGroup(this)">${group.dropdown ? `<span class="chevron">▸</span>` : ""}${group.heading}</div>` : "";
    const items = group.items.map(item => {
      if (!item.to) return "";
      const active = path === item.to || (item.to !== "/" && path.startsWith(item.to + "/"));
      const icon = NAV_ICONS[item.to] ? ICONS[NAV_ICONS[item.to]] : "";
      return `<li><a href="#${item.to}" class="nav-link${active ? " active" : ""}">${icon}<span class="label">${item.label}</span></a></li>`;
    }).join("");
    if (group.dropdown) {
      const autoOpen = group.items.some(i => i.to && (path === i.to || path.startsWith(i.to + "/")));
      const wasOpen = openHeadings.has(group.heading);
      const isOpen = autoOpen || wasOpen;
      return `<div>${heading}<div class="nav-group-items${isOpen ? " open" : ""}"><ul class="nav-list">${items}</ul></div></div>`;
    }
    return `<div>${heading}<ul class="nav-list">${items}</ul></div>`;
  }).join("");
  // Update chevrons based on open state
  document.querySelectorAll(".nav-group-heading").forEach(el => {
    const next = el.nextElementSibling;
    const chev = el.querySelector(".chevron");
    if (chev && next && next.classList.contains("nav-group-items") && next.classList.contains("open")) {
      chev.classList.add("open");
    }
  });
}

function toggleGroup(el) {
  const next = el.nextElementSibling;
  if (next && next.classList.contains("nav-group-items")) {
    next.classList.toggle("open");
    const chev = el.querySelector(".chevron");
    if (chev) chev.classList.toggle("open");
  }
}

function getNavNeighbors(path) {
  const flat = flatNav();
  let idx = flat.findIndex(i => i.to === path);
  if (idx === -1) return {};
  return {
    prev: idx > 0 ? flat[idx - 1] : null,
    next: idx < flat.length - 1 ? flat[idx + 1] : null,
  };
}

function renderMain() {
  const path = currentPath();
  const page = PAGES[path];
  if (!page) { location.hash = "/"; return; }
  document.title = `${page.title} — LuaVM`;
  const { prev, next } = getNavNeighbors(path);
  const pager = (prev || next) ? `
    <div class="pager">
      ${prev ? `<a href="#${prev.to}"><span class="label-tiny">← Previous</span><span class="label-main">${prev.label}</span></a>` : `<div></div>`}
      ${next ? `<a href="#${next.to}" class="right"><span class="label-tiny">Next →</span><span class="label-main">${next.label}</span></a>` : `<div></div>`}
    </div>` : "";
  document.getElementById("main").innerHTML = `
    <article>
      <h1>${page.title}</h1>
      <p class="intro">${page.intro}</p>
      <div class="body">${page.body}</div>
      ${pager}
    </article>
  `;
  window.scrollTo({ top: 0 });
}

function render() { renderSidebar(); renderMain(); if (typeof hljs !== 'undefined') { if (typeof hljsDefineLuau !== 'undefined') hljs.registerLanguage('luau', hljsDefineLuau); document.querySelectorAll('.codeblock').forEach(el => hljs.highlightElement(el)); } }
window.addEventListener("hashchange", render);
render();

// Scroll effect for nav
const navbar = document.querySelector('.glass-nav');
if (navbar) {
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) navbar.classList.add('scrolled');
    else navbar.classList.remove('scrolled');
  });
}

// Simple search filtering
document.getElementById("search-input").addEventListener("input", function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll(".nav-link").forEach(el => {
    const label = el.querySelector(".label");
    if (label) {
      const text = label.textContent.toLowerCase();
      el.style.display = !q || text.includes(q) ? "" : "none";
    }
  });
});

<script>
const canvas = document.getElementById('particle-canvas');
let ctx = null;
let particles = [];
const particleCount = 150;
function resize() {
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
class Particle {
  constructor() {this.init();}
  init() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.vx = (Math.random() - 0.5) * 0.25;
    this.vy = (Math.random() - 0.5) * 0.25;
    this.size = Math.random() * 2;
    this.opacity = Math.random() * 0.4;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.init();
  }
  draw() {
    ctx.fillStyle = `rgba(199, 177, 143, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
function initParticles() {
  if (!canvas) return;
  ctx = canvas.getContext('2d');
  for (let i = 0; i < particleCount; i++) particles.push(new Particle());
  animate();
}
function animate() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {p.update(); p.draw();});
  requestAnimationFrame(animate);
}
initParticles();
</script>
