function highlightLua(text) {
  text = text.replace(/\?/g, '<span class="hl-opt">?</span>');
  text = text.replace(/\b(0x[a-fA-F0-9]+)\b/g, '<span class="hl-num">$1</span>');
  text = text.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="hl-num">$1</span>');
  const keywords = /\b(function|local|if|then|else|elseif|end|for|while|do|repeat|until|return|break|continue|nil|true|false|and|or|not|in)\b/g;
  text = text.replace(keywords, '<span class="hl-kw">$1</span>');
  const types = /\b(string|number|int|float|bool|byte|short|ushort|int64|uint64|double|uint|uintptr|any|void|table|Color3|Vector3|Vector2|UDim|UDim2|CFrame|BrickColor|ColorSequence|NumberRange|NumberSequence|Rect|Ray|Region3|Region3int16|Enum|Axis|Angle|PhysicalProperties|RBXScriptSignal|RBXScriptConnection|Instance|Font|Content)\b/g;
  text = text.replace(types, '<span class="hl-type">$1</span>');
  return text;
}

function toTable(headers, rows) {
  const h = headers.map(h => `<th>${h}</th>`).join("");
  const r = rows.map(r => `<tr>${r.map(c => {
    c = c.replace(/<b>([a-zA-Z_.]+)\(([\s\S]*?)\)<\/b>/g, (m, fn, params) => `<b class="fn">${fn}</b>(${highlightLua(params)})`);
    c = c.replace(/<b>([\s\S]*?)<\/b>/g, '<b class="hl-ident">$1</b>');
    c = c.replace(/<code>([\s\S]*?)<\/code>/g, (m, inner) => `<code>${highlightLua(inner)}</code>`);
    return `<td>${c}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="table-wrap"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;
}

function toCodeblock(code) {
  const id = "cb_" + Math.random().toString(36).slice(2, 8);
  return `<div class="codeblock-wrap"><button class="copy-code-btn" onclick="copyCodeBlock('${id}')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button><div id="${id}" class="codeblock language-lua">${code}</div></div>`;
}

function copyCodeBlock(id) {
  const el = document.getElementById(id);
  const text = el.textContent.trim();
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const btn = el.parentElement.querySelector('.copy-code-btn');
  btn.classList.add('copied');
  btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="14" height="14"><polyline points="20 6 9 17 4 12"/></svg>';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" width="14" height="14"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
  }, 1500);
}

      <h3>Meta-Behavior</h3>
      <ul>
        <li><code>instance.PropertyName</code> first checks built-in properties, then registered class properties, then falls back to child lookup by name.</li>

        <li>Instance property access via <code>__index</code> checks built-in properties first, then registered class properties, then falls back to child lookup by name.</li>

function currentPath() {
  const h = location.hash.replace(/^#/, "");
  return h && PAGES[h] ? h : "/";
}

// Flatten NAV items (in order) for prev/next
function flatNav() {
  const result = [];
  NAV.forEach(g => {
    if (g.items) g.items.forEach(i => { if (i.to) result.push(i); });
  });
  return result;
}

function renderSidebar() {
  const path = currentPath();
  const saved = JSON.parse(localStorage.getItem("luavm_collapsed") || "{}");
  document.getElementById("sidebar").innerHTML = NAV.map((group, gi) => {
    const key = `group_${gi}`;
    const isOpen = saved[key] !== false;
    const items = group.items.map(item => {
      if (!item.to) return "";
      const active = path === item.to || (item.to !== "/" && path.startsWith(item.to + "/"));
      const icon = NAV_ICONS[item.to] ? ICONS[NAV_ICONS[item.to]] : "";
      return `<li><a href="#${item.to}" class="nav-link${active ? " active" : ""}">${icon}<span class="label">${item.label}</span></a></li>`;
    }).join("");
    return `<div class="nav-group"><div class="nav-group-heading" data-group="${key}"><span class="chevron ${isOpen ? "open" : ""}" onclick="toggleNavGroup('${key}')">\u25B8</span>${group.heading}</div><div class="nav-group-items ${isOpen ? "open" : ""}"><ul class="nav-list">${items}</ul></div></div>`;
  }).join("");
}

function toggleNavGroup(key) {
  const saved = JSON.parse(localStorage.getItem("luavm_collapsed") || "{}");
  const wasOpen = saved[key] !== false;
  saved[key] = wasOpen ? false : true;
  localStorage.setItem("luavm_collapsed", JSON.stringify(saved));
  const heading = document.querySelector(`[data-group="${key}"]`);
  if(!heading) return;
  const container = heading.nextElementSibling;
  const chevron = heading.querySelector(".chevron");
  if(wasOpen)
  {
    container.style.maxHeight = container.scrollHeight + "px";
    container.offsetHeight; // force reflow
    container.style.maxHeight = "0";
    container.classList.remove("open");
    chevron.classList.remove("open");
  } else
  {
    container.style.maxHeight = container.scrollHeight + "px";
    container.classList.add("open");
    chevron.classList.add("open");
    const onEnd = () => {
      container.style.maxHeight = "";
      container.removeEventListener("transitionend", onEnd);
    };
    container.addEventListener("transitionend", onEnd);
  }
}

function getNavNeighbors(path) {
  const flat = flatNav();
  let idx = flat.findIndex(i => i.to === path);
  if (idx === -1) return {};
  return {
    prev: idx > 0 ? flat[idx - 1] : null,
    next: idx < flat.length - 1 ? flat[idx + 1] : null,
  };
}

function htmlToMarkdown(html) {
  let md = html;
  md = md.replace(/<h3[^>]*>([\s\S]*?)<\/h3>/g, '### $1\n');
  md = md.replace(/<h4[^>]*>([\s\S]*?)<\/h4>/g, '#### $1\n');
  md = md.replace(/<b>([\s\S]*?)<\/b>/g, '**$1**');
  md = md.replace(/<code>([\s\S]*?)<\/code>/g, '`$1`');
  md = md.replace(/<a[^>]*href="#([^"]*)"[^>]*>([\s\S]*?)<\/a>/g, '[$2]($1)');
  md = md.replace(/<li>([\s\S]*?)<\/li>/g, '- $1\n');
  md = md.replace(/<p[^>]*>([\s\S]*?)<\/p>/g, '$1\n\n');
  md = md.replace(/<br\s*\/?>/g, '\n');
  md = md.replace(/<div[^>]*class="table-wrap">[\s\S]*?<table>/g, '');
  md = md.replace(/<\/table>[\s\S]*?<\/div>/g, '');
  md = md.replace(/<thead>[\s\S]*?<\/thead>/g, '');
  md = md.replace(/<tbody>([\s\S]*?)<\/tbody>/g, '$1');
  md = md.replace(/<tr[^>]*>([\s\S]*?)<\/tr>/g, '$1\n');
  md = md.replace(/<th[^>]*>([\s\S]*?)<\/th>/g, '| $1 ');
  md = md.replace(/<td[^>]*>([\s\S]*?)<\/td>/g, '| $1 ');
  md = md.replace(/\| [\s\S]*? \|\n/g, match => {
    const cols = match.split('|').filter(c => c.trim()).length;
    return match + '|' + Array(cols).fill('---').join('|') + '|\n';
  });
  md = md.replace(/<div[^>]*class="codeblock[^"]*"[^>]*>/g, '```lua\n');
  md = md.replace(/<\/div>\s*<\/div>/g, '```\n\n');
  md = md.replace(/<div[^>]*>/g, '');
  md = md.replace(/<\/div>/g, '');
  md = md.replace(/\n{3,}/g, '\n\n');
  md = md.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
  md = md.trim();
  return md;
}

function copyAll(format) {
  document.getElementById('copyDropdown').classList.remove('open');
  const ordered = flatNav();
  let output;
  if(format === 'html')
  {
    const parts = ['<!-- SHELDON LUA VM - FULL DOCUMENTATION -->'];
    ordered.forEach(item => {
      if (!item.to) return;
      const page = PAGES[item.to];
      if (!page) return;
      parts.push(`<section id="${item.to}">`);
      parts.push(`<h1>${page.title}</h1>`);
      parts.push(`<p>${page.intro}</p>`);
      parts.push(page.body);
      parts.push('</section>');
    });
    output = parts.join('\n');
  } else
  {
    const lines = [];
    lines.push(format === 'markdown' ? '# SHELDON LUA VM - FULL DOCUMENTATION' : '=== SHELDON LUA VM - FULL DOCUMENTATION ===');
    lines.push('');
    ordered.forEach(item => {
      if (!item.to) return;
      const page = PAGES[item.to];
      if (!page) return;
      if(format === 'markdown')
      {
        lines.push('---');
        lines.push(`# ${page.title}`);
        lines.push('');
        lines.push(page.intro);
        lines.push('');
        lines.push(htmlToMarkdown(page.body));
        lines.push('');
      } else
      {
        const d = document.createElement('div');
        d.innerHTML = page.intro + page.body;
        d.querySelectorAll('script,style').forEach(el => el.remove());
        let text = (d.textContent || '').replace(/\s+/g, ' ').trim();
        lines.push('---');
        lines.push(`# ${page.title}`);
        lines.push('');
        lines.push(text);
        lines.push('');
      }
    });
    lines.push(format === 'markdown' ? '# END OF DOCUMENTATION' : '=== END OF DOCUMENTATION ===');
    output = lines.join('\n');
  }
  navigator.clipboard.writeText(output).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = output;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

document.addEventListener('click', function(e) {
  const dd = document.getElementById('copyDropdown');
  if(dd && !dd.contains(e.target)) dd.classList.remove('open');
});
function toggleCopyDropdown() { document.getElementById('copyDropdown').classList.toggle('open'); }

function render() { renderSidebar(); renderMain(); if (typeof hljs !== 'undefined') { if (typeof hljsDefineLuau !== 'undefined') hljs.registerLanguage('luau', hljsDefineLuau); document.querySelectorAll('.codeblock').forEach(el => hljs.highlightElement(el)); } }
window.addEventListener("hashchange", render);
render();

// Scroll effect for nav
const navbar = document.querySelector('.glass-nav');
if (navbar) {
  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) navbar.classList.add('scrolled');
    else navbar.classList.remove('scrolled');
  });
}


</script>
